name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run repository verification
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/verify-knowledge-content-system.ps1
