name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run PowerShell repository verification
        shell: pwsh
        run: pwsh -NoProfile -File ./tests/verify-knowledge-content-system.ps1
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run cross-platform repository verification
        run: python ./tests/verify-knowledge-content-system.py
